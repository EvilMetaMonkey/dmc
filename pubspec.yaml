version: 1.0.0
repository: https://github.com/EvilMetaMonkey/dmc
issue_tracker: https://github.com/EvilMetaMonkey/dmc/issues

environment:
  sdk: ^3.10.8

# Add regular dependencies here.
dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  dart_console: ^4.1.2
  diff_match_patch: ^0.4.1
  path: ^1.9.1
  sqlite3: ^3.1.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
